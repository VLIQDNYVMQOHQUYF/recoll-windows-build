name: Windows portable build (skip Qt in CI, build Meson CLI)

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  VC_REDIST_URL: https://aka.ms/vs/17/release/VC_redist.x64.exe
  QT_VENDOR_URL: SKIPPED

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository (full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if repo contains tracked binary files (enforce no third-party binaries)
        shell: bash
        run: |
          blocked=$(git ls-files | grep -Ei '\.(exe|dll|msi|zip|7z|tar\.gz|tar\.bz2|tar|rar)$' || true)
          if [ -n "$blocked" ]; then
            printf 'ENFORCEMENT: repository contains tracked binary files (forbidden):\n%s\n' "$blocked"
            exit 1
          else
            echo "No tracked forbidden binary files found in repo"
          fi

      - name: Create vendor directory and download VC redistributable (skip Qt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path vendor -Force | Out-Null

          Write-Output "Downloading VC redistributable from $env:VC_REDIST_URL"
          Invoke-WebRequest -Uri $env:VC_REDIST_URL -OutFile vendor\VC_redist.x64.exe -UseBasicParsing
          Write-Output "Downloaded: vendor\VC_redist.x64.exe   Size (bytes): $(Get-Item vendor\VC_redist.x64.exe).Length"

          # Record download report; Qt is intentionally skipped to avoid large downloads/builds in CI
          "VC_REDIST_URL=$env:VC_REDIST_URL" | Out-File vendor/download-report.txt -Encoding ascii
          "VC_redist_size=$(Get-Item vendor\VC_redist.x64.exe).Length" | Out-File vendor/download-report.txt -Append -Encoding ascii
          "QT_VENDOR_URL=SKIPPED" | Out-File vendor/download-report.txt -Append -Encoding ascii
          "Qt_installer_size=SKIPPED" | Out-File vendor/download-report.txt -Append -Encoding ascii

      - name: Setup Visual Studio build environment (use preinstalled MSVC & CMake)
        shell: pwsh
        run: |
          Write-Output "Using windows-latest Visual Studio environment (MSVC)."
          cmake --version || $null
          where cl || $null

      - name: Build from source with Meson (skip Qt GUI in CI)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja
          rm -rf build
          # configure from the recoll-1.44.1 source dir and disable Qt GUI
          meson setup build recoll-1.44.1 --buildtype=release -Dqt=false || meson setup build recoll-1.44.1 -Dqt=false
          meson compile -C build --verbose
          # install into installer/dist (may create directories)
          meson install -C build --destdir=installer/dist || true

      - name: Collect built EXEs and allowed repo files into installer/dist
        shell: bash
        run: |
          mkdir -p installer/dist
          # copy any built .exe from build or installer dist
          find build installer/dist -type f -iname '*.exe' -print 2>/dev/null | while read f; do
            cp -u "$f" "installer/dist/$(basename "$f")" || true
          done
          # copy repo config files that should be packaged
          [ -d recoll-1.44.1/sampleconf ] && cp -r recoll-1.44.1/sampleconf installer/dist/ || true
          [ -d recoll-1.44.1/filters ] && cp -r recoll-1.44.1/filters installer/dist/ || true
          [ -f README.md ] && cp README.md installer/dist/ || true

      - name: Verify installer/dist contains NO unauthorized files (strict check)
        shell: bash
        run: |
          produced=$(mktemp)
          find build -type f \( -name '*.exe' -o -name '*.dll' \) -print | while read p; do realpath "$p"; done > "$produced" || true
          allowed_repo_dirs=()
          [ -d recoll-1.44.1/sampleconf ] && allowed_repo_dirs+=("$(realpath recoll-1.44.1/sampleconf)")
          [ -d recoll-1.44.1/filters ] && allowed_repo_dirs+=("$(realpath recoll-1.44.1/filters)")
          [ -f README.md ] && allowed_repo_dirs+=("$(realpath README.md)")
          bad=0
          while IFS= read -r f; do
            rf=$(realpath "$f")
            if grep -Fxq "$rf" "$produced"; then
              continue
            fi
            ok=0
            for a in "${allowed_repo_dirs[@]}"; do
              case "$a" in
                *.md) [ "$rf" = "$a" ] && ok=1 ;;
                *) case "$rf" in "$a"/*) ok=1 ;; esac ;;
              esac
              [ $ok -eq 1 ] && break
            done
            if [ $ok -eq 1 ]; then
              continue
            fi
            echo "UNAUTHORIZED file in installer/dist: $f"
            bad=1
          done < <(find installer/dist -type f -print 2>/dev/null)
          if [ $bad -ne 0 ]; then
            echo "ENFORCEMENT FAILURE: installer/dist contains unauthorized files. Aborting."
            exit 1
          fi
          echo "installer/dist verified: contains only build-produced artifacts and allowed repo files."

      - name: List DEPENDENCIES of built exes (DLLs) - write reports (PowerShell)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path installer/reports -Force | Out-Null
          $exeFiles = Get-ChildItem -Path installer/dist -Filter *.exe -File -ErrorAction SilentlyContinue
          foreach ($exe in $exeFiles) {
            $base = $exe.Name
            $out = "installer/reports/$($base).deps.txt"
            "Dependencies for $base:" | Out-File $out -Encoding ascii
            & dumpbin /DEPENDENTS $exe.FullName 2>$null | Out-File -Append $out -Encoding ascii
          }
          Write-Output "Dependency reports written to installer/reports/"

      - name: Produce portable ZIP (contains only installer/dist)
        shell: pwsh
        run: |
          $outdir = "installer\Output"
          if (Test-Path $outdir) { Remove-Item $outdir -Recurse -Force }
          New-Item -ItemType Directory -Path $outdir | Out-Null
          $zipfile = Join-Path $outdir "recoll-portable.zip"
          Compress-Archive -Path "installer\dist\*" -DestinationPath $zipfile -Force
          Write-Output "Produced $zipfile"

      - name: Compute SHA256 of produced ZIP (for record)
        shell: pwsh
        run: |
          $zip = "installer\Output\recoll-portable.zip"
          if (Test-Path $zip) {
            Get-FileHash -Path $zip -Algorithm SHA256 | ForEach-Object { $_.Hash } | Out-File -FilePath installer\Output\recoll-portable.zip.sha256 -Encoding ascii
            Write-Output "SHA256 written to installer\Output\recoll-portable.zip.sha256"
          } else {
            Write-Output "No ZIP produced; skipping hash"
          }

      - name: Upload release assets (ZIP + reports + download-report)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/recoll-portable.zip
            installer/Output/recoll-portable.zip.sha256
            installer/reports/*.deps.txt
            vendor/download-report.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
