name: Build Recoll Windows Portable

on:
  workflow_dispatch:
    inputs:
      recoll_version:
        description: 'Recoll version (e.g., 1.44.1)'
        required: true
        default: '1.44.1'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          # Install required build tools
          choco install cmake git -y
          echo "CMAKE_PREFIX_PATH=C:\tools\cmake\bin" >> $env:GITHUB_ENV

      - name: Download source artifact
        uses: actions/download-artifact@v4
        with:
          name: recoll-source
          path: ./source

      - name: Extract Recoll source
        run: |
          cd source
          tar -xzf recoll-*.tar.gz
          cd ..
          # Move extracted folder to working directory
          Move-Item -Path "source/recoll-*" -Destination "recoll-src"

      - name: Create build directory
        run: mkdir -p build

      - name: Configure CMake
        run: |
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 ../recoll-src

      - name: Build Recoll
        run: |
          cd build
          cmake --build . --config Release

      - name: Package portable application
        run: |
          $buildDir = ".\build\Release"
          $portableDir = ".\recoll-portable"
          
          # Create portable directory structure
          New-Item -ItemType Directory -Path "$portableDir\bin" -Force
          New-Item -ItemType Directory -Path "$portableDir\lib" -Force
          New-Item -ItemType Directory -Path "$portableDir\share" -Force
          New-Item -ItemType Directory -Path "$portableDir\etc" -Force
          
          # Copy executables
          Copy-Item -Path "$buildDir\*.exe" -Destination "$portableDir\bin\" -Force
          Copy-Item -Path "$buildDir\*.dll" -Destination "$portableDir\lib\" -Force
          
          # Create portable launcher batch script
          @'
          @echo off
          setlocal enabledelayedexpansion
          set SCRIPTDIR=%~dp0
          set RECOLL_HOME=%SCRIPTDIR%
          set RECOLL_DATADIR=%SCRIPTDIR%share
          set PATH=%SCRIPTDIR%bin;%SCRIPTDIR%lib;%PATH%
          
          if "%1"=="" (
              start "Recoll" "%SCRIPTDIR%bin\recoll.exe"
          ) else (
              "%SCRIPTDIR%bin\recoll.exe" %*
          )
          '@ | Out-File -FilePath "$portableDir\recoll.bat" -Encoding ASCII
          
          # Create README for portable
          @'
          # Recoll Windows Portable
          
          ## Usage
          
          Double-click `recoll.bat` to launch Recoll, or run from command line:
          
          ```
          recoll.bat [options]
          ```
          
          ## Configuration
          
          Configuration files are stored in `%APPDATA%\Recoll` by default, or set:
          
          ```
          set RECOLL_CONFDIR=.\config
          ```
          
          Before running the batch file.
          '@ | Out-File -FilePath "$portableDir\README.md" -Encoding UTF8

      - name: Create portable ZIP
        run: |
          powershell Compress-Archive -Path ".\recoll-portable\*" -DestinationPath "recoll-windows-portable-${{ github.event.inputs.recoll_version }}.zip" -Force

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: recoll-windows-portable
          path: recoll-windows-portable-*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: recoll-windows-portable-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
