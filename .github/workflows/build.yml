name: Download Official Recoll Source

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: windows-latest

    steps:
      - name: Clone official Recoll repository
        run: |
          git clone https://github.com/recoll/recoll.git

      - name: Show downloaded files
        run: |
          dir recoll

      - name: Create ZIP archive
        run: |
          powershell Compress-Archive -Path recoll -DestinationPath recoll-source.zip

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: recoll-source
          path: recoll-source.zip
